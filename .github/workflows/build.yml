name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Phase 1: the Android folder is generated, then patched.
      - name: Generate Android project
        run: |
          flutter create --platforms=android --org ch.markusbaechler --project-name geburtstage .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py

      - name: Install packages
        run: |
          flutter pub get
          flutter pub deps --style=compact | grep -E 'share_plus|file_picker|flutter_contacts|drift ' || true

      - name: Generate code (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      # A fixed signing key, so updates install over the old version
      # without losing data. Stored as repository secret.
      - name: Install fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Fixed key installed"
          else
            echo "::warning::No DEBUG_KEYSTORE_B64 secret: signing key changes on every build"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geburtstage-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish as release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk geburtstage.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest geburtstage.apk \
            --title "Geburtstage ${GITHUB_SHA::7}" \
            --notes "Automatischer Build von ${GITHUB_SHA::7}. Zum Installieren die APK auf dem Handy öffnen." \
            --latest
