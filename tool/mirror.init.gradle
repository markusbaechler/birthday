// Puts Google's mirror of Maven Central in front of the repository lists,
// so builds do not depend on repo.maven.apache.org (HTTP 429 on CI runners).
def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'

beforeSettings { settings ->
    // Declaring plugin repositories drops the implicit Gradle Plugin Portal,
    // so it is added back after the mirror.
    settings.pluginManagement.repositories {
        maven { url mirror }
        gradlePluginPortal()
    }
    settings.dependencyResolutionManagement.repositories {
        maven { url mirror }
    }
}

// Project-level repositories only in the app build itself. Included builds
// (Flutter's Gradle tooling) forbid project repositories and use the
// settings-level mirror above.
beforeProject { project ->
    if (project.gradle.parent == null) {
        project.buildscript.repositories {
            maven { url mirror }
        }
        project.repositories {
            maven { url mirror }
        }
    }
}
