name: geburtstage
description: Verlässliche Geburtstags-Erinnerungen mit persönlichen Glückwünschen.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  flutter_contacts: ">=1.1.9 <2.0.0"
  path_provider: ^2.1.4
  share_plus: ">=11.0.0 <20.0.0"
  file_picker: ^13.4.1
  intl: any
  home_widget: ">=0.7.0 <2.0.0"
  shared_preferences: ">=2.3.0 <4.0.0"
  url_launcher: ">=6.3.0 <8.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12
  flutter_launcher_icons: ">=0.14.0 <2.0.0"

flutter:
  uses-material-design: true
  fonts:
    # Downloaded in CI from github.com/google/fonts (OFL), see build.yml
    - family: RobotoFlex
      fonts:
        - asset: assets/fonts/RobotoFlex.ttf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
