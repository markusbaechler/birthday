name: geburtstage
description: Verlässliche Geburtstags-Erinnerungen mit persönlichen Glückwünschen.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  flutter_contacts: ^1.1.9
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  file_picker: ^8.1.2
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
